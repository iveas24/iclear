<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iclear · Historia de Instagram</title>
<style>
  html, body { margin: 0; height: 100%; background: #050606; }
  body { display: grid; place-items: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
<script src="timeline.js"></script>
<script src="shots.js"></script>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Instagram story promo for iclear. Deterministic: renderFrame(t) draws time t
// (seconds). Scene order and durations come from timeline.js; opened normally
// it plays in a loop, render.mjs drives it frame by frame.
//
// All figures below describe a fictional demo Mac (16 GB) — never real data.
const W = 1080, H = 1920;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const TL = window.TIMELINE;
let acc = 0;
const SCENES = TL.scenes.map(s => { const o = { ...s, start: acc, end: acc + s.dur }; acc += s.dur; return o; });
const DURATION = acc;
const at = id => SCENES.find(s => s.id === id);
const BEAT = TL.beat;
const GROOVE_START = at('intro').start, GROOVE_END = at('end').start;

// Demo machine (fictional).
const DEMO = { ram: 16, demand: 23.5, compressedFrom: 12.4, compressedTo: 5.8, score: 31, battery: 92, cycles: 214, rpm: 3200, temp: 52 };

const C = {
  bg: '#0b0c0d', surface: '#141617', surface2: '#1c1f20', surface3: '#232728',
  hair: 'rgba(255,255,255,0.08)', hairStrong: 'rgba(255,255,255,0.14)',
  text: '#eceeed', text2: '#8d9392', text3: '#5c6261',
  accent: '#3ddc84', accentStrong: '#5ff09c', accentInk: '#04140b',
  warn: '#e5b454', danger: '#ef5b5b',
};
const SANS = '-apple-system, "SF Pro Display", system-ui, "Helvetica Neue", sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, monospace';

// UI screenshots (shots.js, generated by shots.mjs from the app's demo data).
const IMGS = {};
window.READY = Promise.all(Object.entries(window.SHOTS || {}).map(([k, src]) => new Promise(r => {
  const im = new Image();
  im.onload = () => { IMGS[k] = im; r(); };
  im.onerror = r;
  im.src = src;
})));

// ---------- math ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const backOut = k => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const gb = v => v.toFixed(1).replace('.', ',') + ' GB';
const size = g => g >= 1 ? gb(g) : Math.round(g * 1000) + ' MB';

// ---------- drawing helpers ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function card(x, y, w, h, r = 40, fill = C.surface) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 24;
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
  rr(x + 0.5, y + 0.5, w - 1, h - 1, r); ctx.strokeStyle = C.hair; ctx.lineWidth = 2; ctx.stroke();
  ctx.save(); rr(x, y, w, h, r); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + 120);
  g.addColorStop(0, 'rgba(255,255,255,0.045)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, 120);
  ctx.restore();
}
function text(str, x, y, { size = 48, weight = 600, color = C.text, align = 'left', font = SANS, spacing = 0, baseline = 'alphabetic' } = {}) {
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = baseline;
  ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y);
  ctx.letterSpacing = '0px';
}
function glowText(str, x, y, opts, color = C.accent, blur = 40) {
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = blur; text(str, x, y, opts); ctx.restore();
}
function measure(str, size, weight = 600, font = SANS, spacing = 0) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = spacing + 'px';
  const w = ctx.measureText(str).width; ctx.letterSpacing = '0px'; return w;
}
function pillWidth(str, size, dot = true) { return measure(str, size, 600) + 52 + (dot ? size * 0.9 : 0); }
function pill(str, x, y, { color = C.accent, size = 30, align = 'left', solid = false, dot = true } = {}) {
  const pad = 26, h = size * 1.9, dotW = dot ? size * 0.9 : 0;
  const w = pillWidth(str, size, dot);
  const x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  rr(x0, y, w, h, h / 2);
  ctx.fillStyle = solid ? color : hexA(color, 0.13); ctx.fill();
  if (!solid) { ctx.strokeStyle = hexA(color, 0.35); ctx.lineWidth = 2; ctx.stroke(); }
  if (dot) {
    ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(x0 + pad + size * 0.22, y + h / 2, size * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = solid ? C.accentInk : color; ctx.fill(); ctx.restore();
  }
  text(str, x0 + pad + dotW, y + h / 2 + 1, { size, weight: 600, color: solid ? C.accentInk : color, baseline: 'middle' });
  return w;
}
function button(label, xRight, y, h, press = 0, light = true) {
  const bw = measure(label, 28, 650) + 56;
  const cx = xRight - bw / 2, cy = y + h / 2, s = 1 - press * 0.1;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  if (press > 0) { ctx.shadowColor = C.accent; ctx.shadowBlur = 30 * press; }
  rr(xRight - bw, y, bw, h, h / 2); ctx.fillStyle = light ? C.text : C.surface3; ctx.fill();
  ctx.shadowBlur = 0;
  text(label, cx, cy + 1, { size: 28, weight: 650, align: 'center', baseline: 'middle', color: light ? C.bg : C.text });
  ctx.restore();
}
function ring(cx, cy, r, k, color, width = 26, track = 'rgba(255,255,255,0.07)') {
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = track; ctx.lineWidth = width; ctx.stroke();
  if (k <= 0.001) return;
  const a0 = -Math.PI / 2;
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + Math.PI * 2 * k); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
  ctx.restore();
}
function bar(x, y, w, h, k, color, track = 'rgba(255,255,255,0.06)') {
  rr(x, y, w, h, h / 2); ctx.fillStyle = track; ctx.fill();
  if (k <= 0) return;
  ctx.save(); ctx.shadowColor = color; ctx.shadowBlur = 18;
  rr(x, y, Math.max(h, w * Math.min(k, 1)), h, h / 2); ctx.fillStyle = color; ctx.fill(); ctx.restore();
}
function check(cx, cy, s, color = C.accentInk, lw = 8) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(cx - s * 0.5, cy + s * 0.02); ctx.lineTo(cx - s * 0.15, cy + s * 0.36); ctx.lineTo(cx + s * 0.5, cy - s * 0.36); ctx.stroke();
}
function checkBadge(cx, cy, r, k) {
  if (k <= 0) return;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k);
  ctx.shadowColor = C.accent; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = C.accent; ctx.fill();
  ctx.shadowBlur = 0; check(0, 0, r * 0.9, C.accentInk, r * 0.22);
  ctx.restore();
}
function spinner(cx, cy, r, t) {
  ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = C.accent;
  ctx.beginPath(); ctx.arc(cx, cy, r, t * 9, t * 9 + 4.2); ctx.stroke();
}
// Words pop in one by one (kinetic typography). lines: [[text, color], ...][]
function kinetic(lines, y, lt, a, size = 84, delay = 0, lh = 1.1) {
  let wi = 0;
  lines.forEach((parts, li) => {
    const words = [];
    for (const [str, col] of parts) str.split(' ').filter(Boolean).forEach(w => words.push([w, col]));
    const space = measure(' ', size, 700, SANS, -2);
    const widths = words.map(([w]) => measure(w, size, 700, SANS, -2));
    const total = widths.reduce((s, w) => s + w, 0) + space * (words.length - 1);
    let x = W / 2 - total / 2;
    words.forEach(([w, col], k) => {
      const p = clamp((lt - delay - wi * 0.07) / 0.38);
      const e = backOut(p);
      if (p > 0) {
        ctx.save();
        ctx.globalAlpha = a * clamp(p * 2.5);
        const cx = x + widths[k] / 2, cy = y + li * size * lh;
        ctx.translate(cx, cy + (1 - e) * 46);
        ctx.scale(0.6 + 0.4 * e, 0.6 + 0.4 * e);
        if (col === C.accent) { ctx.shadowColor = C.accent; ctx.shadowBlur = 30; }
        text(w, -widths[k] / 2, 0, { size, weight: 700, color: col, spacing: -2 });
        ctx.restore();
      }
      x += widths[k] + space; wi++;
    });
  });
}
// Monospace label typed in, with a dot and a blinking cursor.
function eyebrow(str, y, a, lt) {
  const n = Math.round(str.length * clamp(lt / 0.35));
  const shown = str.slice(0, n);
  const w = measure(str, 30, 700, MONO, 6);
  const x = W / 2 - w / 2;
  ctx.globalAlpha = a;
  ctx.save(); ctx.shadowColor = C.accent; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(x - 30, y - 10, 8, 0, Math.PI * 2); ctx.fillStyle = C.accent; ctx.fill(); ctx.restore();
  text(shown, x, y, { size: 30, weight: 700, font: MONO, color: C.accent, spacing: 6 });
  if (n < str.length || Math.floor(lt * 3) % 2 === 0) {
    const cw = measure(shown, 30, 700, MONO, 6);
    ctx.fillStyle = C.accent; ctx.fillRect(x + cw + 4, y - 28, 14, 34);
  }
  ctx.globalAlpha = 1;
}
function logo(cx, cy, s, draw = 1) {
  const half = s / 2;
  const g = ctx.createLinearGradient(0, cy - half, 0, cy + half);
  g.addColorStop(0, '#1f2324'); g.addColorStop(1, '#0b0c0d');
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = s * 0.2; ctx.shadowOffsetY = s * 0.06;
  rr(cx - half, cy - half, s, s, s * 0.23); ctx.fillStyle = g; ctx.fill(); ctx.restore();
  rr(cx - half + 1, cy - half + 1, s - 2, s - 2, s * 0.23); ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = Math.max(1, s * 0.004); ctx.stroke();
  const r = s * 0.279, lw = s * 0.053;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = lw; ctx.stroke();
  const a0 = -Math.PI / 2, sweep = Math.PI * 2 * 0.81 * draw;
  const rg = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
  rg.addColorStop(0, '#7dffb3'); rg.addColorStop(1, '#2fbf70');
  ctx.save(); ctx.shadowColor = C.accent; ctx.shadowBlur = s * 0.12;
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + sweep); ctx.strokeStyle = rg; ctx.lineWidth = lw; ctx.stroke(); ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, s * 0.056 * clamp(draw * 2), 0, Math.PI * 2); ctx.fillStyle = C.text; ctx.fill();
}
function fanIcon(cx, cy, r, angle, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
  ctx.fillStyle = color;
  for (let i = 0; i < 5; i++) {
    ctx.rotate(Math.PI * 2 / 5);
    ctx.beginPath(); ctx.ellipse(r * 0.48, 0, r * 0.46, r * 0.2, 0.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2); ctx.fillStyle = C.surface; ctx.fill();
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.08, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 3; ctx.stroke();
}
// Screenshot drawn "cover" inside a box, zoomed toward (fx, fy).
function shot(name, x, y, w, h, zoom = 1, fx = 0.5, fy = 0.5) {
  const im = IMGS[name];
  if (!im) { ctx.fillStyle = C.surface2; ctx.fillRect(x, y, w, h); return; }
  const s = Math.max(w / im.width, h / im.height) * zoom;
  const dw = im.width * s, dh = im.height * s;
  ctx.drawImage(im, x + (w - dw) * fx, y + (h - dh) * fy, dw, dh);
}
function macWindow(x, y, w, h, drawContent) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 90; ctx.shadowOffsetY = 40;
  rr(x, y, w, h, 26); ctx.fillStyle = '#0f1112'; ctx.fill();
  ctx.restore();
  ctx.save(); rr(x, y, w, h, 26); ctx.clip(); drawContent(); ctx.restore();
  [['#ff5f57', 0], ['#febc2e', 1], ['#28c840', 2]].forEach(([c, i]) => {
    ctx.beginPath(); ctx.arc(x + 30 + i * 26, y + 26, 8, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill();
  });
  rr(x + 0.5, y + 0.5, w - 1, h - 1, 26); ctx.strokeStyle = C.hairStrong; ctx.lineWidth = 2; ctx.stroke();
}

// ---------- ambient ----------
function beatPulse(t) {
  if (t < GROOVE_START || t >= GROOVE_END) return 0;
  return Math.exp(-((t - GROOVE_START) % BEAT) / 0.12);
}
function background(t) {
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  const pulse = beatPulse(t);
  const gx = W / 2 + Math.sin(t * 0.6) * 240, gy = 600 + Math.cos(t * 0.45) * 180;
  let g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 950);
  g.addColorStop(0, `rgba(61,220,132,${0.12 + 0.05 * pulse})`); g.addColorStop(1, 'rgba(61,220,132,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  g = ctx.createRadialGradient(W * 0.15, H * 0.92, 0, W * 0.15, H * 0.92, 800);
  g.addColorStop(0, 'rgba(140,150,148,0.08)'); g.addColorStop(1, 'rgba(140,150,148,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(255,255,255,${0.05 + 0.03 * pulse})`;
  const step = 40, off = (t * 14) % step;
  for (let y = -step + off; y < H; y += step)
    for (let x = 20; x < W; x += step) ctx.fillRect(x, y, 3, 3);
  for (let i = 0; i < 70; i++) {
    const speed = 30 + hash(i) * 90;
    const x = hash(i + 100) * W + Math.sin(t * 0.8 + i) * 18;
    const y = H + 50 - ((t * speed + hash(i + 200) * (H + 100)) % (H + 100));
    const r = 1.5 + hash(i + 300) * 3.5;
    const tw = 0.5 + 0.5 * Math.sin(t * 3 + i * 1.7);
    ctx.globalAlpha = (0.12 + 0.4 * tw) * (0.6 + 0.4 * pulse);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = C.accent; ctx.fill();
  }
  ctx.globalAlpha = 1;
  g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function brandBar(t) {
  const a = Math.min(easeOut(prog(t, 0.2, 0.8)), 1 - prog(t, GROOVE_END - 0.25, GROOVE_END));
  if (a <= 0) return;
  ctx.globalAlpha = a;
  logo(W / 2 - 92, 300, 64, 1);
  text('iclear', W / 2 - 48, 316, { size: 44, weight: 700, spacing: -1 });
  ctx.globalAlpha = 1;
}
// Flash + light sweep on every cut.
function cutFX(t) {
  for (const s of SCENES.slice(1)) {
    const d = t - s.start;
    if (d < 0 || d > 0.45) continue;
    ctx.globalAlpha = 0.22 * Math.pow(1 - d / 0.45, 2);
    ctx.fillStyle = '#d9ffe9'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
    const y = lerp(-500, H + 500, easeOut(d / 0.45));
    const g = ctx.createLinearGradient(0, y - 260, 0, y + 260);
    g.addColorStop(0, 'rgba(61,220,132,0)'); g.addColorStop(0.5, 'rgba(61,220,132,0.22)'); g.addColorStop(1, 'rgba(61,220,132,0)');
    ctx.fillStyle = g; ctx.fillRect(0, y - 260, W, 520);
  }
}

// ---------- scenes: draw(lt, a) with lt = seconds since the scene started ----------
const DRAW = {
  hook(lt, a) {
    kinetic([[['¿Tu Mac', C.text]], [['va ', C.text], ['lento?', C.accent]]], 720, lt, a, 150, 0.05);
    const k = easeInOut(prog(lt, 1.1, 2.4));
    const x = 120, y = 1130, w = 840, h = 64;
    const ramW = w * (DEMO.ram / DEMO.demand);
    const s = easeOut(prog(lt, 0.9, 1.3));
    ctx.globalAlpha = a * s;
    text('Tus apps piden', x, y - 70, { size: 44, weight: 500, color: C.text2 });
    text(gb(lerp(0, DEMO.demand, k)), x + w, y - 70, { size: 56, weight: 700, color: k * DEMO.demand > DEMO.ram ? C.warn : C.text, align: 'right', font: MONO });
    rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fill();
    const fillW = w * k;
    ctx.save(); rr(x, y, w, h, h / 2); ctx.clip();
    ctx.shadowColor = C.accent; ctx.shadowBlur = 20;
    ctx.fillStyle = C.accent; ctx.fillRect(x, y, Math.min(fillW, ramW), h);
    if (fillW > ramW) {
      const pulse = 0.75 + 0.25 * Math.sin(lt * 14);
      ctx.shadowColor = C.warn; ctx.fillStyle = hexA(C.warn, pulse);
      ctx.fillRect(x + ramW, y, fillW - ramW, h);
    }
    ctx.restore();
    ctx.fillStyle = C.text; ctx.fillRect(x + ramW - 2, y - 18, 4, h + 36);
    text(`${DEMO.ram} GB de RAM`, x + ramW, y + h + 70, { size: 34, weight: 600, color: C.text2, align: 'center', font: MONO });
    const over = easeOut(prog(lt, 2.3, 2.7));
    ctx.globalAlpha = a * over;
    text('Lo que no cabe, se comprime o va al disco.', W / 2, 1400 + (1 - over) * 20, { size: 42, weight: 500, color: C.text2, align: 'center' });
  },

  intro(lt, a) {
    eyebrow('PRESENTAMOS', 470, a, lt);
    kinetic([[['El centro de control', C.text]], [['que tu Mac necesitaba', C.accent]]], 565, lt, a, 72, 0.1);
    const e = backOut(clamp((lt - 0.1) / 0.6));
    const wx = 60, ww = 960, wh = 600, wy = lerp(1950, 740, e);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(W / 2, wy + wh / 2); ctx.rotate((1 - clamp(e)) * 0.08); ctx.translate(-W / 2, -(wy + wh / 2));
    const screens = [['Panel', 1.0, 1.08, 0.5, 0.5], ['Memoria', 1.0, 1.5, 0.25, 0.3], ['Ventiladores', 1.05, 1.3, 0.4, 0.4]];
    const seg = 1.45, t0 = 0.45;
    const idx = clamp(Math.floor((lt - t0) / seg), 0, screens.length - 1);
    const local = lt - t0 - idx * seg;
    macWindow(wx, wy, ww, wh, () => {
      const draw = (i, dx) => {
        const [name, z0, z1, fx, fy] = screens[i];
        const z = lerp(z0, z1, easeInOut(clamp((i === idx ? local : seg) / seg)));
        shot(name, wx + dx, wy, ww, wh, z, fx, fy);
      };
      const sl = idx > 0 ? easeInOut(clamp(local / 0.3)) : 1;
      if (idx > 0 && sl < 1) draw(idx - 1, -ww * sl);
      draw(idx, ww * (1 - sl));
    });
    ctx.restore();
    const labels = ['Memoria', 'Batería', 'Ventiladores', 'Limpieza', 'Apps', 'Procesos'];
    const active = screens[idx][0];
    [labels.slice(0, 3), labels.slice(3)].forEach((row, r) => {
      const sz = 28, gap = 16;
      const widths = row.map(l => pillWidth(l, sz, false));
      let x = W / 2 - (widths.reduce((s, w) => s + w, 0) + gap * (row.length - 1)) / 2;
      row.forEach((l, i) => {
        const k = backOut(clamp((lt - 0.7 - (r * 3 + i) * 0.08) / 0.35));
        if (k > 0) {
          ctx.save();
          ctx.globalAlpha = a * clamp(k);
          const cx = x + widths[i] / 2, cy = 1420 + r * 86 + 27;
          ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy);
          pill(l, x, 1420 + r * 86, { color: l === active ? C.accent : C.text2, size: sz, dot: false, solid: l === active });
          ctx.restore();
        }
        x += widths[i] + gap;
      });
    });
  },

  memory(lt, a) {
    eyebrow('MEMORIA', 470, a, lt);
    kinetic([[['Te dice ', C.text], ['por qué', C.accent]]], 585, lt, a, 88, 0.05);
    ctx.globalAlpha = a;
    const cy = 680 + (1 - easeOut(clamp(lt / 0.5))) * 90;
    card(80, cy, 920, 900);
    const k = easeOut(prog(lt, 0.3, 1.6));
    const score = Math.round(lerp(100, DEMO.score, k));
    const col = score > 59 ? C.accent : score > 25 ? C.warn : C.danger;
    ring(260, cy + 200, 110, score / 100, col, 22);
    text(String(score), 260, cy + 222, { size: 86, weight: 700, align: 'center', font: MONO });
    text('SALUD', 260, cy + 268, { size: 22, weight: 700, color: C.text3, align: 'center', font: MONO, spacing: 4 });
    pill('Presión: advertencia', 420, cy + 110, { color: C.warn, size: 28 });
    text('Comprimiendo', 420, cy + 230, { size: 32, weight: 500, color: C.text2 });
    text(`${gb(DEMO.compressedFrom).replace(' GB', '')} → ${gb(DEMO.compressedTo)}`, 420, cy + 282, { size: 44, weight: 700, font: MONO });
    const apps = [
      ['Google Chrome', 5.8, 'Navegador', '42 pestañas'],
      ['Docker', 3.1, 'Máquina virtual', ''],
      ['Figma', 1.6, 'App', ''],
      ['Slack', 1.2, 'App', ''],
      ['Spotify', 0.6, 'App', 'sin uso'],
    ];
    ctx.fillStyle = C.hair; ctx.fillRect(130, cy + 360, 820, 2);
    apps.forEach(([name, g, kind, extra], i) => {
      const rk = easeOut(prog(lt, 0.6 + i * 0.13, 1.05 + i * 0.13));
      const y = cy + 430 + i * 96;
      ctx.globalAlpha = a * rk;
      const dx = (1 - rk) * 90;
      text(name, 130 + dx, y, { size: 38, weight: 600 });
      text(kind + (extra ? ' · ' + extra : ''), 130 + dx, y + 40, { size: 26, weight: 500, color: C.text3 });
      text(gb(g * clamp(rk * 1.2)), 950, y, { size: 38, weight: 700, align: 'right', font: MONO, color: i < 2 ? C.warn : C.text });
      bar(620, y + 26, 330, 10, rk * g / 5.8, i < 2 ? C.warn : C.accent);
    });
  },

  recs(lt, a) {
    eyebrow('RECOMENDACIONES INTELIGENTES', 470, a, lt);
    kinetic([[['Sabe qué ', C.text], ['no estás usando', C.accent]]], 590, lt, a, 76, 0.05);
    const recs = [
      ['Spotify está abierta sin uso', 'No la usas hace 6 horas', '640 MB', 'Cerrar app', C.warn],
      ['Docker reserva 3,1 GB', 'Máquina virtual encendida', '3,1 GB', 'Cerrar app', C.warn],
      ['Chrome: 42 pestañas · 5,8 GB', 'Activa Ahorro de memoria', '2,9 GB', 'Ver cómo', C.accent],
    ];
    recs.forEach(([title, sub, save, btn, col], i) => {
      const k = backOut(clamp(prog(lt, 0.35 + i * 0.3, 0.8 + i * 0.3)));
      if (k <= 0) return;
      const y = 690 + i * 250;
      ctx.save();
      ctx.globalAlpha = a * clamp(k);
      const fromX = i % 2 ? 1 : -1;
      ctx.translate((1 - clamp(k)) * 300 * fromX, 0);
      ctx.translate(W / 2, y + 105); ctx.scale(0.9 + 0.1 * k, 0.9 + 0.1 * k); ctx.translate(-W / 2, -(y + 105));
      card(80, y, 920, 210, 36);
      rr(80, y + 40, 8, 130, 4); ctx.fillStyle = col; ctx.fill();
      text(title, 130, y + 78, { size: 38, weight: 650 });
      text(sub, 130, y + 124, { size: 28, weight: 500, color: C.text2 });
      pill('libera ' + save, 130, y + 146, { color: C.accent, size: 24, dot: false });
      const press = i === 0 ? prog(lt, 2.0, 2.15) - prog(lt, 2.15, 2.35) : 0;
      button(btn, 950, y + 76, 60, press, i < 2);
      ctx.restore();
      if (i === 0) {
        const done = easeOut(prog(lt, 2.3, 2.4));
        if (done > 0) {
          ctx.save(); ctx.globalAlpha = a * done;
          rr(80, y, 920, 210, 36); ctx.fillStyle = C.surface; ctx.fill();
          rr(80.5, y + 0.5, 919, 209, 36); ctx.strokeStyle = hexA(C.accent, 0.4); ctx.lineWidth = 2; ctx.stroke();
          ctx.restore();
          ctx.globalAlpha = a;
          checkBadge(170, y + 105, 34, backOut(done));
          ctx.globalAlpha = a * done;
          text('Spotify cerrada · +640 MB libres', 225, y + 117, { size: 38, weight: 650, color: C.accent });
        }
      }
    });
    const tk = easeOut(prog(lt, 1.5, 2.6));
    ctx.globalAlpha = a * clamp(tk * 1.5);
    text('Hasta', W / 2, 1530, { size: 40, weight: 500, color: C.text2, align: 'center' });
    glowText(gb(lerp(0, 6.6, tk)) + ' de vuelta', W / 2, 1625, { size: 84, weight: 750, color: C.accent, align: 'center', spacing: -2 });
  },

  apps(lt, a) {
    eyebrow('APPS SIN USO', 470, a, lt);
    const k = easeOut(prog(lt, 0.2, 1.3));
    ctx.globalAlpha = a;
    const pop = lt > 1.3 ? 1 + 0.06 * Math.exp(-(lt - 1.3) / 0.12) : 1;
    ctx.save(); ctx.translate(W / 2, 600); ctx.scale(pop, pop); ctx.translate(-W / 2, -600);
    glowText(gb(lerp(0, 9.8, k)), W / 2, 660, { size: 170, weight: 750, align: 'center', spacing: -6, color: C.text }, C.accent, 50);
    ctx.restore();
    text('en apps que no abres hace meses', W / 2, 740, { size: 44, weight: 500, color: C.text2, align: 'center' });
    const apps = [
      ['GarageBand', '2,1 GB', '14 meses sin uso'],
      ['iMovie', '3,2 GB', '9 meses sin uso'],
      ['Blender', '1,1 GB', '7 meses sin uso'],
      ['Zoom', '540 MB', '5 meses sin uso'],
    ];
    const cy = 820 + (1 - easeOut(clamp(lt / 0.5))) * 90;
    card(80, cy, 920, 640, 40);
    apps.forEach(([name, sz, why], i) => {
      const rk = easeOut(prog(lt, 0.5 + i * 0.12, 0.95 + i * 0.12));
      const y = cy + 80 + i * 140;
      const gone = i === 0 ? easeInOut(prog(lt, 2.1, 2.5)) : 0;
      ctx.globalAlpha = a * rk * (1 - gone);
      const dx = (1 - rk) * 90 + gone * -120;
      rr(130 + dx, y - 40, 84, 84, 22); ctx.fillStyle = C.surface3; ctx.fill();
      text(name[0].toUpperCase(), 172 + dx, y + 2, { size: 40, weight: 700, align: 'center', baseline: 'middle', color: C.text2 });
      text(name, 244 + dx, y - 4, { size: 38, weight: 600 });
      text(why, 244 + dx, y + 38, { size: 26, weight: 500, color: C.text3 });
      pill('Sin uso', 600 + dx, y - 34, { color: C.warn, size: 22, dot: false });
      text(sz, 950 + dx, y + 12, { size: 34, weight: 700, align: 'right', font: MONO });
      if (i < 3) { ctx.globalAlpha = a * rk * 0.6 * (1 - gone); ctx.fillStyle = C.hair; ctx.fillRect(130, y + 70, 820, 2); }
      if (i === 0 && gone > 0) {
        ctx.globalAlpha = a;
        checkBadge(172, y, 34, backOut(gone));
        ctx.globalAlpha = a * gone;
        text('Desinstalada, sin restos', 244, y + 2, { size: 36, weight: 650, color: C.accent, baseline: 'middle' });
        text('−2,1 GB', 950, y + 12, { size: 34, weight: 700, align: 'right', font: MONO, color: C.accent });
      }
    });
    const fk = easeOut(prog(lt, 1.4, 1.9));
    ctx.globalAlpha = a * fk;
    text('También limpia lo que dejaron apps ya borradas.', W / 2, 1550, { size: 38, weight: 500, color: C.text2, align: 'center' });
  },

  cleanup(lt, a) {
    eyebrow('LIMPIEZA SEGURA', 470, a, lt);
    kinetic([[['Libera espacio ', C.text], ['sin miedo', C.accent]]], 585, lt, a, 80, 0.05);
    const cy = 690 + (1 - easeOut(clamp(lt / 0.5))) * 90;
    ctx.globalAlpha = a;
    card(80, cy, 920, 770, 40);
    const rows = [
      ['Cachés de desarrollo', 'npm, cargo, pip, Xcode', 3.1],
      ['Papelera', 'Archivos que ya borraste', 2.4],
      ['Cachés de apps', 'Se regeneran solos', 1.6],
      ['Registros', 'Logs viejos del sistema', 0.31],
    ];
    let total = 0;
    rows.forEach(([name, sub, g], i) => {
      const y = cy + 290 + i * 105;
      const rk = easeOut(prog(lt, 0.3 + i * 0.1, 0.7 + i * 0.1));
      const ck = clamp(backOut(clamp(prog(lt, 0.8 + i * 0.2, 1.05 + i * 0.2))), 0, 1.2);
      total += g * clamp(ck);
      ctx.globalAlpha = a * rk;
      const dx = (1 - rk) * 90;
      rr(130 + dx, y - 34, 48, 48, 14);
      ctx.fillStyle = ck > 0 ? C.accent : 'rgba(255,255,255,0.06)'; ctx.fill();
      if (ck > 0) { ctx.save(); ctx.translate(154 + dx, y - 10); ctx.scale(ck, ck); check(0, 0, 26, C.accentInk, 6); ctx.restore(); }
      else { rr(130 + dx, y - 34, 48, 48, 14); ctx.strokeStyle = C.hairStrong; ctx.lineWidth = 2; ctx.stroke(); }
      text(name, 205 + dx, y - 6, { size: 36, weight: 600 });
      text(sub, 205 + dx, y + 30, { size: 24, weight: 500, color: C.text3 });
      text(size(g), 950 + dx, y + 2, { size: 34, weight: 700, align: 'right', font: MONO });
    });
    ctx.globalAlpha = a;
    text('SELECCIONADO', 130, cy + 90, { size: 22, weight: 700, font: MONO, color: C.text3, spacing: 4 });
    glowText(gb(total), 130, cy + 190, { size: 100, weight: 750, color: C.accent, spacing: -3 });
    const press = prog(lt, 2.2, 2.35) - prog(lt, 2.35, 2.5);
    button('Revisar y limpiar', 950, cy + 110, 66, press);
    const pk = easeInOut(prog(lt, 2.5, 3.4));
    if (pk > 0) {
      bar(130, cy + 718, 820, 12, pk, C.accent);
      text(pk < 1 ? 'Limpiando…' : `${gb(total)} liberados`, 130, cy + 698, { size: 30, weight: 650, color: pk < 1 ? C.text2 : C.accent });
    }
    const nk = easeOut(prog(lt, 1.2, 1.6));
    ctx.globalAlpha = a * nk;
    text('Siempre ves la lista antes de borrar.', W / 2, 1540, { size: 38, weight: 500, color: C.text2, align: 'center' });
  },

  control(lt, a) {
    eyebrow('CONTROL TOTAL', 470, a, lt);
    kinetic([[['Batería, ventiladores', C.text]], [['y ', C.text], ['mucho más', C.accent]]], 580, lt, a, 76, 0.05);
    const tiles = [[80, 760], [550, 760], [80, 1190], [550, 1190]];
    tiles.forEach(([x, y], i) => {
      const k = backOut(clamp(prog(lt, 0.25 + i * 0.1, 0.7 + i * 0.1)));
      if (k <= 0) return;
      ctx.save();
      ctx.globalAlpha = a * clamp(k);
      ctx.translate(x + 225, y + 200); ctx.scale(0.8 + 0.2 * k, 0.8 + 0.2 * k); ctx.rotate((1 - clamp(k)) * (i % 2 ? 0.1 : -0.1)); ctx.translate(-(x + 225), -(y + 200));
      card(x, y, 450, 400, 40);
      const cx = x + 225;
      if (i === 0) {
        const v = easeOut(prog(lt, 0.5, 1.6));
        ring(cx, y + 160, 92, DEMO.battery / 100 * v, C.accent, 20);
        text(Math.round(DEMO.battery * v) + '%', cx, y + 178, { size: 56, weight: 700, align: 'center', font: MONO });
        text('Batería', x + 44, y + 320, { size: 36, weight: 650 });
        text(`Salud · ${DEMO.cycles} ciclos`, x + 44, y + 362, { size: 26, weight: 500, color: C.text3 });
      } else if (i === 1) {
        const rpm = Math.round(lerp(0, DEMO.rpm, easeOut(prog(lt, 0.6, 1.8))));
        fanIcon(cx, y + 160, 92, lt * (2 + rpm / 400), C.text2);
        text('Ventiladores', x + 44, y + 320, { size: 36, weight: 650 });
        text(rpm.toLocaleString('es-CL') + ' rpm · manual', x + 44, y + 362, { size: 26, weight: 500, color: C.text3, font: MONO });
      } else if (i === 2) {
        ctx.save(); ctx.beginPath();
        const pts = 40, reveal = easeOut(prog(lt, 0.6, 1.8));
        for (let p = 0; p <= pts * reveal; p++) {
          const px = x + 44 + (362 * p / pts);
          const py = y + 190 - (Math.sin(p * 0.45 + 1 + lt * 2) * 34 + Math.sin(p * 0.17) * 22 + p * 0.9);
          p === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        }
        ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.shadowColor = C.accent; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
        text(`${DEMO.temp} °C`, x + 406, y + 80, { size: 40, weight: 700, align: 'right', font: MONO });
        text('Temperaturas', x + 44, y + 320, { size: 36, weight: 650 });
        text('Decenas de sensores', x + 44, y + 362, { size: 26, weight: 500, color: C.text3 });
      } else {
        const procs = [['Chrome', 31], ['Figma', 19], ['Docker', 14]];
        procs.forEach(([n, c], j) => {
          const v = easeOut(prog(lt, 0.7 + j * 0.1, 1.5 + j * 0.1)) * (c + Math.sin(lt * 6 + j) * 4);
          text(n, x + 44, y + 90 + j * 66, { size: 28, weight: 600, color: C.text2 });
          text(Math.round(v) + '%', x + 406, y + 90 + j * 66, { size: 28, weight: 700, align: 'right', font: MONO });
          bar(x + 44, y + 106 + j * 66, 362, 8, v / 40, C.accent);
        });
        text('Procesos', x + 44, y + 320, { size: 36, weight: 650 });
        text('CPU y memoria en vivo', x + 44, y + 362, { size: 26, weight: 500, color: C.text3 });
      }
      ctx.restore();
    });
  },

  optimize(lt, a) {
    eyebrow('OPTIMIZAR', 470, a, lt);
    kinetic([[['Un clic. ', C.text], ['Listo.', C.accent]]], 580, lt, a, 96, 0.05);
    const mk = easeOut(prog(lt, 0.15, 0.55));
    const my = 650 - (1 - mk) * 40;
    ctx.globalAlpha = a * mk;
    rr(60, my, 960, 72, 20); ctx.fillStyle = 'rgba(28,31,32,0.92)'; ctx.fill();
    rr(60.5, my + 0.5, 959, 71, 20); ctx.strokeStyle = C.hair; ctx.lineWidth = 2; ctx.stroke();
    text('Finder', 100, my + 46, { size: 28, weight: 700 });
    text('Archivo   Edición   Ver', 200, my + 46, { size: 26, weight: 500, color: C.text2 });
    text('10:30', 985, my + 46, { size: 28, weight: 600, align: 'right' });
    const tx = 650, tw = 230, glow = 0.5 + 0.5 * Math.sin(lt * 7);
    ctx.save(); ctx.shadowColor = C.accent; ctx.shadowBlur = 20 + 20 * glow;
    rr(tx, my + 12, tw, 48, 14); ctx.fillStyle = hexA(C.accent, 0.14 + 0.1 * glow); ctx.fill(); ctx.restore();
    logo(tx + 30, my + 36, 32, 1);
    text(`${DEMO.battery}% · ${DEMO.temp}°`, tx + 56, my + 46, { size: 26, weight: 650, font: MONO });
    const ck = easeOut(prog(lt, 0.35, 0.8));
    const cy = 780 + (1 - ck) * 90;
    ctx.globalAlpha = a * ck;
    card(80, cy, 920, 600, 40);
    const rows = [
      ['Liberar memoria inactiva', 'purge'],
      ['Vaciar caché DNS', 'dscacheutil'],
      ['Reducir snapshots locales', 'Time Machine'],
      ['Reindexar Spotlight', 'mdutil'],
    ];
    rows.forEach(([title, sub], i) => {
      const y = cy + 110 + i * 130;
      const rk = easeOut(prog(lt, 0.5 + i * 0.1, 0.9 + i * 0.1));
      const ts = 1.0 + i * 0.5;
      ctx.globalAlpha = a * ck * rk;
      const dx = (1 - rk) * 90;
      if (lt < ts) { ctx.beginPath(); ctx.arc(160 + dx, y - 10, 30, 0, Math.PI * 2); ctx.strokeStyle = C.hairStrong; ctx.lineWidth = 4; ctx.stroke(); }
      else if (lt < ts + 0.4) spinner(160 + dx, y - 10, 28, lt);
      else checkBadge(160 + dx, y - 10, 30, clamp(backOut(clamp((lt - ts - 0.4) / 0.25)), 0, 1.15));
      ctx.globalAlpha = a * ck * rk;
      text(title, 215 + dx, y - 4, { size: 36, weight: 600 });
      text(sub, 215 + dx, y + 34, { size: 24, weight: 500, color: C.text3, font: MONO });
      if (lt >= ts + 0.4) pill('Listo', 950, y - 38, { color: C.accent, size: 24, align: 'right' });
      if (i < 3) { ctx.fillStyle = C.hair; ctx.fillRect(130, y + 62, 820, 2); }
    });
  },

  trust(lt, a) {
    eyebrow('PRIVADO Y SEGURO', 470, a, lt);
    const sk = backOut(clamp(prog(lt, 0.1, 0.55)));
    ctx.save();
    ctx.globalAlpha = a * clamp(sk);
    ctx.translate(W / 2, 730);
    ctx.setLineDash([22, 16]); ctx.lineDashOffset = -lt * 80;
    ctx.beginPath(); ctx.arc(0, 0, 170, 0, Math.PI * 2); ctx.strokeStyle = hexA(C.accent, 0.5); ctx.lineWidth = 4; ctx.stroke();
    ctx.lineDashOffset = lt * 50;
    ctx.beginPath(); ctx.arc(0, 0, 215, 0, Math.PI * 2); ctx.strokeStyle = hexA(C.accent, 0.18); ctx.lineWidth = 3; ctx.stroke();
    ctx.setLineDash([]);
    ctx.scale(sk * 1.25, sk * 1.25);
    ctx.beginPath();
    ctx.moveTo(0, -100); ctx.lineTo(80, -70); ctx.lineTo(80, 10); ctx.quadraticCurveTo(80, 80, 0, 110);
    ctx.quadraticCurveTo(-80, 80, -80, 10); ctx.lineTo(-80, -70); ctx.closePath();
    const g = ctx.createLinearGradient(0, -100, 0, 110); g.addColorStop(0, '#1f2324'); g.addColorStop(1, '#0f1112');
    ctx.fillStyle = g; ctx.shadowColor = C.accent; ctx.shadowBlur = 50; ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.stroke();
    check(0, 4, 70, C.accent, 12);
    ctx.restore();
    kinetic([[['Tus datos', C.text]], [['no salen de tu Mac', C.accent]]], 1050, lt, a, 80, 0.3);
    const rows = ['100% local: sin cuentas ni nube', 'Vista previa antes de borrar cualquier cosa', 'Nativo para Apple Silicon, hecho en Rust'];
    rows.forEach((r, i) => {
      const k = easeOut(prog(lt, 0.9 + i * 0.18, 1.3 + i * 0.18));
      const y = 1250 + i * 90;
      const dx = (1 - k) * 80;
      ctx.globalAlpha = a * k;
      checkBadge(150 + dx, y - 12, 22, k);
      ctx.globalAlpha = a * k;
      text(r, 195 + dx, y, { size: 34, weight: 550, color: C.text });
    });
  },

  end(lt, a) {
    const s = 300 * (0.85 + 0.15 * backOut(clamp(lt / 0.6)));
    for (let i = 0; i < 3; i++) {
      const p = (lt * 0.7 + i / 3) % 1;
      ctx.globalAlpha = a * (1 - p) * 0.35;
      ctx.beginPath(); ctx.arc(W / 2, 780, 170 + p * 380, 0, Math.PI * 2); ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.stroke();
    }
    ctx.globalAlpha = a;
    logo(W / 2, 780, s, easeInOut(prog(lt, 0.1, 0.9)));
    const k = easeOut(prog(lt, 0.4, 0.9));
    ctx.globalAlpha = a * k;
    text('iclear', W / 2, 1100 + (1 - k) * 40, { size: 150, weight: 750, align: 'center', spacing: -5 });
    kinetic([[['Tu Mac, ', C.text2], ['como nuevo.', C.accent]]], 1195, lt, a, 56, 0.9);
    const k3 = backOut(clamp(prog(lt, 1.4, 1.8)));
    if (k3 > 0) {
      ctx.save(); ctx.globalAlpha = a * clamp(k3);
      ctx.translate(W / 2, 1312); ctx.scale(k3, k3); ctx.translate(-W / 2, -1312);
      pill('Pronto para macOS', W / 2, 1280, { color: C.accent, size: 34, align: 'center', solid: true });
      ctx.restore();
    }
    const k4 = easeOut(prog(lt, 2.0, 2.5));
    ctx.globalAlpha = a * k4;
    text('Síguenos para el lanzamiento', W / 2, 1450, { size: 36, weight: 600, color: C.text2, align: 'center' });
    const bounce = Math.abs(Math.sin(lt * 5)) * 16;
    ctx.strokeStyle = C.accent; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(W / 2 - 22, 1490 + bounce); ctx.lineTo(W / 2, 1512 + bounce); ctx.lineTo(W / 2 + 22, 1490 + bounce); ctx.stroke();
  },
};

function renderFrame(t) {
  ctx.globalAlpha = 1;
  background(t);
  brandBar(t);
  const bp = beatPulse(t);
  for (const s of SCENES) {
    const last = s === SCENES[SCENES.length - 1];
    if (t < s.start || (t >= s.end && !last)) continue;
    const lt = t - s.start;
    const fin = easeOut(clamp(lt / 0.2));
    const fout = last ? 1 - prog(lt, s.dur - 0.5, s.dur) : 1 - easeInOut(prog(lt, s.dur - 0.2, s.dur));
    const a = Math.min(fin, fout);
    if (a <= 0) continue;
    // Camera: punch-in on entry, push up on exit, pulse on the beat, shake on the logo hit.
    const punch = 1 + 0.1 * (1 - easeOut(clamp(lt / 0.4)));
    const exitY = last ? 0 : -110 * easeInOut(prog(lt, s.dur - 0.2, s.dur));
    const sc = punch * (1 + 0.012 * bp);
    const shake = s.id === 'end' ? (1 - clamp(lt / 0.5)) * 12 : 0;
    ctx.save();
    ctx.translate(W / 2 + Math.sin(lt * 80) * shake, H / 2 + exitY + Math.cos(lt * 70) * shake);
    ctx.scale(sc, sc);
    ctx.translate(-W / 2, -H / 2);
    DRAW[s.id](lt, a, s.dur);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  cutFX(t);
  ctx.globalAlpha = 1;
}
window.renderFrame = renderFrame;
window.DURATION = DURATION;

if (!location.search.includes('render')) {
  window.READY.then(() => {
    const start = performance.now();
    const loop = now => { renderFrame(((now - start) / 1000) % DURATION); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
} else {
  renderFrame(0);
}
</script>
