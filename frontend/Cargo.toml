[package]
name = "iclear-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iclear-protocol.workspace = true
serde.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "Event", "KeyboardEvent", "MouseEvent", "Performance", "console"] }
console_error_panic_hook = "0.1"
